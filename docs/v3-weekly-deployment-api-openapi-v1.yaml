openapi: 3.1.0
info:
  title: PAGe Weekly Shadow API
  version: 4.2.0
  description: Internal shadow-only API wrapping the governed PAGe weekly v2/v3 transaction and exposing validated M0/M1 monitoring, M2 forecasts, an optional A+2 test-volume challenger, and experimental immutable probability queries.
servers:
  - url: http://127.0.0.1:8088
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Monitoring:
      type: object
      description: Disclosure-safe monitoring projection sourced only from validated v3 child-run artifacts.
      properties:
        A:
          type: object
          properties:
            m0: {type: object, description: A ignition state; eligible from weekF12}
            m1: {type: object, description: A peak timing mean, 90% interval, and passage/near-peak probabilities}
        B:
          type: object
          properties:
            m1: {type: object, description: B activity/timing state and posterior peak fields when available}
    Result:
      type: object
      required: [run_id, season, origin_weekF, release_id, effective_panel_sha256, a_shadow_option, monitoring, forecasts, a_shadow, probabilities]
      properties:
        monitoring: {$ref: '#/components/schemas/Monitoring'}
        forecasts: {type: array}
        a_shadow_option: {type: string, enum: ['off', 'exp050_h2']}
        a_shadow: {type: object, description: Optional experimental A+2 EXP050 challenger; canonical forecasts remain unchanged}
        probabilities: {type: object, description: Experimental probability snapshot availability and query endpoints}
    ProbabilityQuery:
      type: object
      required: [status, available, kind, type, operator, threshold, threshold_scale, probability]
      properties:
        status: {type: string, enum: [experimental, unavailable]}
        available: {type: boolean}
        kind: {type: string, enum: [positivity, peak]}
        type: {type: string, enum: [A, B]}
        horizon: {type: [integer, 'null']}
        operator: {type: string, enum: ['>', '<']}
        threshold: {type: number}
        threshold_scale: {type: string, enum: [proportion, weekF]}
        probability: {type: [number, 'null'], minimum: 0, maximum: 1}
    Trigger:
      type: object
      additionalProperties: false
      required: [season, expected_release_id]
      properties:
        season: {type: string, const: '2026-27'}
        expected_release_id: {type: string, const: '5472d08992b5a9da40a9419b75c7427847ff7b1999070041d5e38b0a71da853b'}
        a_shadow_option: {type: string, enum: ['off', 'exp050_h2'], default: 'off', description: Optional shadow-only A+2 challenger. Does not replace canonical A1 or alter probability calibration.}
paths:
  /healthz:
    get:
      responses:
        '200': {description: Process liveness only}
  /readyz:
    get:
      responses:
        '200': {description: Ready}
        '503': {description: Not ready}
  /v1/release:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Pinned shadow release and API deployment identity}
  /v1/weekly-runs:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Trigger'}
      responses:
        '202': {description: New or active job accepted}
        '200': {description: Idempotent replay of terminal existing job}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '409': {description: Idempotency conflict or season busy}
        '503': {description: API not ready}
  /v1/weekly-runs/{run_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string, pattern: '^wr_[0-9a-f]{32}$'}}
      responses:
        '200': {description: Durable job state}
        '404': {description: Unknown run}
  /v1/weekly-runs/{run_id}/result:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string, pattern: '^wr_[0-9a-f]{32}$'}}
      responses:
        '200':
          description: Immutable disclosure-safe result projection with M0/M1 monitoring and M2 forecasts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '409': {description: Job not succeeded}
  /v1/weekly-runs/{run_id}/provenance:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string, pattern: '^wr_[0-9a-f]{32}$'}}
      responses:
        '200': {description: Immutable disclosure-safe provenance projection}
        '409': {description: Job not succeeded}

  /v1/weekly-runs/{run_id}/probability/positivity:
    get:
      security: [{bearerAuth: []}]
      description: Experimental immutable P(p > threshold) query from the run-bound OOS residual snapshot. Threshold is a proportion, e.g. 0.02 = 2%.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string, pattern: '^wr_[0-9a-f]{32}$'}}
        - {in: query, name: type, required: true, schema: {type: string, enum: [A, B]}}
        - {in: query, name: horizon, required: true, schema: {type: integer, enum: [1, 2]}}
        - {in: query, name: threshold, required: true, schema: {type: number, minimum: 0, maximum: 1}}
      responses:
        '200': {description: Experimental strict exceedance probability, content: {application/json: {schema: {$ref: '#/components/schemas/ProbabilityQuery'}}}}
        '400': {description: Invalid query}
        '409': {description: Run not succeeded or probability snapshot unavailable}
  /v1/weekly-runs/{run_id}/probability/peak:
    get:
      security: [{bearerAuth: []}]
      description: Experimental immutable P(peak week < week) query from the run-bound M1 passage posterior snapshot.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string, pattern: '^wr_[0-9a-f]{32}$'}}
        - {in: query, name: type, required: true, schema: {type: string, enum: [A, B]}}
        - {in: query, name: week, required: true, schema: {type: number}}
      responses:
        '200': {description: Experimental strict peak timing probability or explicit unavailable projection, content: {application/json: {schema: {$ref: '#/components/schemas/ProbabilityQuery'}}}}
        '400': {description: Invalid query}
        '409': {description: Run not succeeded or probability snapshot unavailable}
